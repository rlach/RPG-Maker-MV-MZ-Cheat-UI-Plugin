<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <base href="./" />
        <title>Cheat UI</title>
        <link href="libs/mdi/css/materialdesignicons.min.css" rel="stylesheet" />
        <link href="libs/vuetify.css" rel="stylesheet" />
        <link href="css/main.css" rel="stylesheet" />
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #1e1e1e;
            }
            #app {
                width: 100%;
                height: 100%;
            }
            /* Override CheatModal fixed size */
            .z-index-cheat-0.v-card {
                width: 100% !important;
                height: 100% !important;
            }
        </style>
        <script>
            console.log('[CheatWindow] window.html loading...');
            window.__CHEAT_EXTERNAL_WINDOW__ = true;

            // Get parent window reference
            const parentWin = window.opener;

            // Log to parent window console as well for debugging
            if (parentWin && parentWin.console) {
                const oldLog = console.log;
                const oldError = console.error;
                const oldWarn = console.warn;

                console.log = function (...args) {
                    oldLog.apply(console, args);
                    try {
                        parentWin.console.log('[ExtWindow]', ...args);
                    } catch (e) {}
                };
                console.error = function (...args) {
                    oldError.apply(console, args);
                    try {
                        parentWin.console.error('[ExtWindow]', ...args);
                    } catch (e) {}
                };
                console.warn = function (...args) {
                    oldWarn.apply(console, args);
                    try {
                        parentWin.console.warn('[ExtWindow]', ...args);
                    } catch (e) {}
                };
                console.log('[CheatWindow] Console forwarding set up');
            }

            if (!parentWin) {
                console.error('[CheatWindow] No parent window (opener)');
                throw new Error('External cheat window must be opened from parent window');
            }

            // Sync key RPG Maker globals from parent
            const sharePrefixes = ['$game', '$data'];
            const shareNames = [
                'SceneManager',
                'AudioManager',
                'SoundManager',
                'ImageManager',
                'DataManager',
                'BattleManager',
                'ConfigManager',
                'StorageManager',
                'PluginManager',
                'Input',
                'TouchInput',
                'Graphics',
                'TextManager',
                'Utils',
                'Game_Interpreter',
                'Game_Message',
                'Game_Temp',
                'Game_System',
                'Game_Switches',
                'Game_Variables',
                'Window_Message',
                'Window_ChoiceList',
                'Scene_Map',
                'Scene_Battle',
                'Game_Map',
                'axios',
            ];

            for (const key of Object.keys(parentWin)) {
                if (
                    sharePrefixes.some((prefix) => key.startsWith(prefix)) ||
                    shareNames.includes(key)
                ) {
                    try {
                        window[key] = parentWin[key];
                    } catch (err) {
                        // ignore if cannot copy
                    }
                }
            }

            // Get default component from URL or parent
            const params = new URLSearchParams(window.location.search);
            const fromQuery = params.get('component');
            if (fromQuery) {
                window.__CHEAT_DEFAULT_COMPONENT__ = fromQuery;
            } else if (parentWin.__CHEAT_DEFAULT_COMPONENT__) {
                window.__CHEAT_DEFAULT_COMPONENT__ = parentWin.__CHEAT_DEFAULT_COMPONENT__;
            }

            console.log('[CheatWindow] Globals synced from parent');
        </script>
        <!-- <script src="libs/axios.min.js"></script> -->
    </head>
    <body>
        <div style="position: fixed; top: 5px; right: 5px; z-index: 9999">
            <button
                onclick="openDevTools()"
                style="
                    background: #333;
                    color: white;
                    border: 1px solid #666;
                    padding: 5px 10px;
                    cursor: pointer;
                "
            >
                Dev Tools
            </button>
        </div>
        <div id="app"></div>
        <script>
            function openDevTools() {
                if (typeof require !== 'undefined') {
                    try {
                        require('nw.gui').Window.get().showDevTools();
                    } catch (e) {
                        console.error('Failed to open dev tools:', e);
                    }
                }
            }
        </script>
        <script type="module">
            console.log('[CheatWindow] Module script loading');
            (async function () {
                // parentWin is already declared in the parent <script> tag and available globally
                const { loadWindowUiLibraries, isolateWindowComponent, createWindowUiApp } =
                    await import('./js/WindowUiLibraries.js');
                await loadWindowUiLibraries(window);
                if (!window.Vue || !window.Vuetify) {
                    console.error('[CheatWindow] Vue/Vuetify not loaded locally');
                    throw new Error('Vue/Vuetify must be loaded in external window');
                }

                const parentWin = window.opener;

                // Fallback: share axios from parent if local not loaded
                if (!window.axios && parentWin && parentWin.axios) {
                    window.axios = parentWin.axios;
                }

                console.log('[CheatWindow] Using local Vue:', typeof window.Vue);

                // Import cheat components
                try {
                    // Force fresh import by adding timestamp to bypass module cache
                    const timestamp = Date.now();

                    console.log('[CheatWindow] Importing CheatModal...');
                    const CheatModal = isolateWindowComponent(
                        (await import(`./CheatModal.js?t=${timestamp}`)).default
                    );
                    console.log('[CheatWindow] CheatModal imported:', CheatModal);
                    console.log(
                        '[CheatWindow] CheatModal components:',
                        Object.keys(CheatModal.components || {})
                    );

                    console.log('[CheatWindow] Importing AlertSnackbar...');
                    const AlertSnackbar = isolateWindowComponent(
                        (await import('./components/AlertSnackbar.js')).default
                    );
                    console.log('[CheatWindow] AlertSnackbar imported');

                    console.log('[CheatWindow] Importing ConfirmDialog...');
                    const ConfirmDialog = isolateWindowComponent(
                        (await import('./components/ConfirmDialog.js')).default
                    );
                    console.log('[CheatWindow] ConfirmDialog imported');

                    console.log('[CheatWindow] Importing TranslateOnTheFlyPanel...');
                    const TranslateOnTheFlyPanel = (
                        await import('./panels/TranslateOnTheFlyPanel.js')
                    ).default;
                    console.log('[CheatWindow] TranslateOnTheFlyPanel imported');

                    console.log('[CheatWindow] Importing TranslationRuntime...');
                    const { ensureTranslationRuntime } =
                        await import('./js/translation-runtime/TranslationRuntime.js');
                    console.log('[CheatWindow] TranslationRuntime imported');

                    const defaultComponent = window.__CHEAT_DEFAULT_COMPONENT__ || 'GeneralPanel';
                    const kebabToPascal = (str) =>
                        str
                            .split('-')
                            .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
                            .join('');
                    const ObjectTranslationModalHost = (
                        await import('./components/ObjectTranslationModalHost.js')
                    ).default;
                    const BoxingModal = (await import('./components/BoxingModal.js')).default;
                    const app = createWindowUiApp(window, {
                        components: {
                            CheatModal,
                            AlertSnackbar,
                            ConfirmDialog,
                            ObjectTranslationModalHost,
                            BoxingModal,
                        },
                        data: () => ({ currentComponentName: kebabToPascal(defaultComponent) }),
                        template:
                            '<v-app><v-main style="height:100%;padding:0"><cheat-modal v-model:current-component-name="currentComponentName" /></v-main><alert-snackbar /><confirm-dialog /><object-translation-modal-host /><boxing-modal /></v-app>',
                    });
                    const vm = app.mount('#app');
                    window.addEventListener('beforeunload', () => app.unmount(), { once: true });

                    // Expose for debugging
                    window.__CHEAT_APP__ = vm;

                    console.log('[CheatWindow] Vue app mounted in external window, app:', app);
                    console.log('[CheatWindow] App element:', vm.$el);
                    console.log('[CheatWindow] Initial component:', vm.currentComponentName);

                    console.log('[CheatWindow] Vue app mounted in external window');

                    // Boot translation hook
                    try {
                        if (
                            parentWin &&
                            typeof parentWin.__ensureTranslationRuntime === 'function'
                        ) {
                            parentWin.__ensureTranslationRuntime();
                        } else {
                            ensureTranslationRuntime();
                        }
                        console.log('[CheatWindow] Translation runtime ensured');
                    } catch (err) {
                        console.warn('[CheatWindow] Failed to mount translator', err);
                    }
                } catch (err) {
                    console.error('[CheatWindow] Failed to import or mount components:', err);
                    document.body.innerHTML =
                        '<div style="color: white; padding: 20px;">Error loading cheat window:<br><pre>' +
                        err.stack +
                        '</pre></div>';
                }
            })();
        </script>
    </body>
</html>
